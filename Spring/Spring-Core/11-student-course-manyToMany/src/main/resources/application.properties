spring.application.name=11-student-course-manyToMany

spring.datasource.url=jdbc:mysql://localhost:3306/student_course_manyToMany
spring.datasource.username=root
spring.datasource.password=root

logging.level.org.hibernate.orm.jdbc.bind=trace
